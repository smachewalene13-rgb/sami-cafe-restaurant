services:
  # Backend REST API and Socket.IO Service
  - type: web
    name: sami-cafe-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sami-cafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TAX_RATE
        value: 0.15
      - key: DEFAULT_DELIVERY_FEE
        value: 120.00
      - key: CLIENT_URL
        sync: false

databases:
  # Managed PostgreSQL Database on Render
  - name: sami-cafe-db
    databaseName: sami_cafe
    user: postgres
    plan: free
